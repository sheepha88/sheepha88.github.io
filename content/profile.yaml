product:
  name: ImageTrial
  summary: 임상시험 의료영상을 독립 평가자가 판독·채점하고, 그 결과를 규제기관에 제출할 수 있는 데이터로 남기는 영상평가 B2B SaaS. 140개 병원, 의사 80명 사용.
  customers: 제약사·CRO(임상시험 수탁기관), 프로젝트 단위 계약.
  users: 평가자(판독의·피부과 전문의), 프로젝트를 세팅하는 운영인력, 데이터 매니저.
  lines: ImageTrial(항암 BICR·안과·대장내시경) / ImageTrial for Derma(피부·미용의료 사진 평가)
  role_steps:
    - name: 기획
      detail: 요구사항정의서·기능명세서·화면설계서
    - name: 개발 관리
      detail: Jira 스프린트
    - name: 검증
      detail: CSV 리딩
    - name: 배포
      detail: 배포 항목 결정·일정 관리
  screens:
    - file: product-dashboard.webp
      caption: 프로젝트 대시보드
      alt: ImageTrial 프로젝트 대시보드 화면, 사이트별 진행 현황과 운영 현황 차트
    - file: product-viewer.webp
      caption: DICOM 뷰어
      alt: DICOM 뷰어에서 손 X-ray 영상을 측정 도구와 함께 판독하는 화면
    - file: product-derma.webp
      caption: ImageTrial for Derma
      alt: 피부 사진 평가에 쓰는 얼굴 이미지 화면, 눈 부위는 가려져 있음
    - file: product-form.webp
      caption: 평가 폼
      alt: 복부 초음파 항목을 입력하는 ImageTrial 평가 폼 화면
  deliverables:
    - file: product-fds.webp
      caption: 기획 · 기능명세서
      alt: 요구사항 ID별 기능을 정리한 기능명세서 표
    - file: product-figma.webp
      caption: 기획 · 화면설계서
      alt: Figma로 화면 간 흐름을 정리한 화면설계서
    - file: product-jira.webp
      caption: 개발 관리 · 스프린트
      alt: Jira 스프린트 티켓의 우선순위, 계획·실제 SP, 상태를 정리한 표

